<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu Pedido - Na Brasas</title>
    
    <!-- Caminhos corrigidos com ../ -->
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="../estilos/stylepedido.css">
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<!-- ===================== CABEÇALHO ===================== -->
<header id="cabecalho">
    <h1>
        <span class="spann">N</span>
        <span class="span-texto">
            <span class="spannabrasa">A BRASAS</span>
            <span class="spanhamburgueria">HAMBURGUERIA</span>
        </span>
    </h1>
    <nav>
        <ul>
            <!-- Caminho corrigido com ../ para voltar à raiz -->
            <li><a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a></li>
        </ul>
    </nav>
</header>

<!-- ===================== SEÇÃO DE PEDIDOS ===================== -->
<section id="planos" class="secao">
    <h2>NOSSOS PRODUTOS</h2>
    
    <div class="menu-tabs">
        <button class="tab-btn ativo" onclick="mudarCategoria('lanches')">
            <i class="fa-solid fa-burger"></i> Lanches
        </button>
        <button class="tab-btn" onclick="mudarCategoria('bebidas')">
            <i class="fa-solid fa-glass-water"></i> Bebidas
        </button>
        <button class="tab-btn" onclick="mudarCategoria('doces')">
            <i class="fa-solid fa-ice-cream"></i> Doces e Sobremesas
        </button>
    </div>

    <!-- Contêineres dos produtos -->
    <div id="cat-lanches" class="categoria-conteudo ativo"></div>
    <div id="cat-bebidas" class="categoria-conteudo"></div>
    <div id="cat-doces" class="categoria-conteudo"></div>
</section>

<!-- ===================== BOTÃO DO CARRINHO ===================== -->
<button id="btn-carrinho" onclick="abrirCarrinho()">
    <i class="fa-solid fa-bag-shopping"></i>
    <span id="badge-carrinho" class="escondido">0</span>
</button>

<!-- ===================== MODAL DO CARRINHO ===================== -->
<div id="modal-carrinho" class="modal-overlay">
    <div class="modal-conteudo">
        <div class="modal-header">
            <h3>Seu Pedido</h3>
            <button class="fechar-modal" onclick="fecharCarrinho()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="lista-carrinho"></div>

        <div class="modal-footer">
            <div class="total-carrinho">
                <span>Total:</span>
                <strong id="total-carrinho-valor">R$ 0,00</strong>
            </div>
            
            <div class="form-cliente">
                <input type="text" id="nome-cliente" placeholder="Seu Nome (Obrigatório)" required>
                <input type="tel" id="tel-cliente" placeholder="Seu WhatsApp (Opcional)" maxlength="15" inputmode="numeric">
            </div>

            <button class="btn-amarelo btn-enviar" onclick="enviarPedido()">
                <i class="fa-solid fa-paper-plane"></i> Enviar Pedido
            </button>
        </div>
    </div>
</div>

<!-- ===================== SCRIPTS ===================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Caminho corrigido com ../ -->
<script src="../script/pedidos.js"></script>
</body>
</html>
