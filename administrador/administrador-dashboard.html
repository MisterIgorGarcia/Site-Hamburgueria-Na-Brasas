<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Na Brasas</title>
<!-- Caminho ajustado para a sua pasta estilos -->
<link rel="stylesheet" href="../estilos/style.css">
<link rel="stylesheet" href="../estilos/styleadmin.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="view-login">
  <div class="login-box">
    <h1>Painel — Na Brasas</h1>
    <p>Acesso restrito a administradores e funcionários</p>
    <form id="form-login">
      <label>Login</label>
      <input type="text" id="inp-login" required autocomplete="username">
      <label>Senha</label>
      <input type="password" id="inp-senha" required autocomplete="current-password">
      <button type="submit" id="btn-entrar">Entrar</button>
      <div class="erro" id="login-erro"></div>
    </form>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="view-dash">
  <header>
    <div>
      <h1>Painel — Na Brasas</h1>
      <div class="user-info" id="user-info"></div>
    </div>
    <div class="botoes">
      <button class="btn" id="btn-conectar">🔌 Conectar Impressora</button>
      <button class="btn btn-perigo" id="btn-sair">Sair</button>
    </div>
  </header>

  <div class="status-impressora" id="status-impressora">
    <span class="bolinha"></span>
    <span id="status-texto">Impressora desconectada</span>
  </div>

  <main>
    <h2>Pedidos recentes</h2>
    <div id="lista-pedidos">
      <div class="vazio">Nenhum pedido ainda. Aguardando...</div>
    </div>
  </main>
</div>

<!-- ===================== SUPABASE SDK ===================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Caminho ajustado para a sua pasta script -->
<script src="../script/admin-dashboard.js"></script>
</body>
</html>
