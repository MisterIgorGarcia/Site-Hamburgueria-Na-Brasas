<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Painel Admin — Na Brasas</title>
<link rel="stylesheet" href="../estilos/style.css">
<link rel="stylesheet" href="../estilos/styleadmin.css">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Google Charts -->
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div id="view-dash" class="ativo">
  <header>
    <div class="header-brand">
      <h1>Painel Admin</h1>
      <div class="user-info" id="user-info">Carregando...</div>
      <!-- Botão para abrir o perfil -->
      <button class="btn-admin" onclick="abrirModalPerfil()" style="margin-top: 8px; font-size: 0.75rem; padding: 4px 10px; width: fit-content;">
        <i class="fa-solid fa-user-gear"></i> Alterar Senha
      </button>
    </div>
      <!-- Botão para abrir os logs -->
      <button class="btn-admin" onclick="toggleTerminal()" style="margin-top: 8px; font-size: 0.75rem; padding: 4px 10px; width: fit-content;">
        <i class="fa-solid fa-terminal"></i> Ver Logs
      </button>
    </div>
    
    <div class="botoes">
        <button class="btn-admin tooltip" id="btn-conectar">
            <span id="txt-bt"><i class="fa-brands fa-bluetooth-b"></i> Bluetooth</span>
            <span class="tooltip-content" id="tip-bt">Conectar via Bluetooth (Celular)</span>
        </button>
        <button class="btn-admin tooltip" id="btn-conectar-usb">
            <span id="txt-usb"><i class="fa-solid fa-plug"></i>USB</span>
            <span class="tooltip-content" id="tip-usb">
                Conectar via Cabo USB (PC)<br>
                Use o app <a href="https://zadig.akeo.ie" target="_blank">Zadig</a> no Windows.
            </span>
        </button>
        <button class="btn-admin btn-admin-perigo tooltip" onclick="sair()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
        </button>
    </div>
  </header>

  <div id="terminal-container" class="terminal-container" style="display: none;">
    <div class="terminal-header">Últimos 10 Logs</div>
    <div id="terminal-logs" class="terminal-logs"></div>
  </div>
  
  <div class="status-impressora" id="status-impressora">
    <span class="bolinha"></span>
    <span id="status-texto">Impressora desconectada</span>
  </div>

  <!-- NAVEGAÇÃO POR ABAS -->
  <div class="abas-container">
    <button class="aba-btn ativo" onclick="mudarAba('recentes')">
        <i class="fa-solid fa-list-ul"></i> Recentes
        <!-- Badge de Notificação vazio -->
        <span id="badge-notificacao" class="badge-notif escondido"></span>
    </button>
    <button class="aba-btn" onclick="mudarAba('historico')"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</button>
    <button class="aba-btn" onclick="mudarAba('graficos')"><i class="fa-solid fa-chart-pie"></i> Gráficos</button>
    <button class="aba-btn" onclick="mudarAba('funcionarios')"><i class="fa-solid fa-users"></i> Funcionários</button>
  </div>

  <main>
    <!-- ABA 1: RECENTES -->
    <div id="aba-recentes" class="conteudo-aba ativo">
      <div class="top-bar-aba">
        <h2>Pedidos na Fila</h2>
      </div>
      <div id="lista-pedidos">
        <div class="vazio">Nenhum pedido ainda. Aguardando...</div>
      </div>
      <div id="paginacao-recentes" class="paginacao-container"></div>
    </div>

    <!-- ABA 2: HISTÓRICO -->
    <div id="aba-historico" class="conteudo-aba">
      <div class="top-bar-aba">
        <h2>Arquivados / Impressos</h2>
      </div>
      <div id="lista-historico">
        <div class="vazio">Carregando histórico...</div>
      </div>
      <div id="paginacao-historico" class="paginacao-container"></div>
    </div>

    <!-- ABA 3: GRÁFICOS -->
    <div id="aba-graficos" class="conteudo-aba">
      <div class="top-bar-aba">
        <h2>Análise de Vendas</h2>
      </div>
      <div class="grafico-container">
        <div id="piechart" style="width: 100%; height: 350px;"></div>
      </div>
      <div class="grafico-container" style="margin-top: 20px;">
        <div id="linechart" style="width: 100%; height: 350px;"></div>
      </div>
    </div>

    <!-- ABA 4: FUNCIONÁRIOS -->
    <div id="aba-funcionarios" class="conteudo-aba">
        <div class="top-bar-aba" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <h2>Gerenciar Funcionários</h2>
            <button class="btn-admin btn-admin-primario" onclick="abrirModalFuncionario()">
                <i class="fa-solid fa-plus"></i> Novo Funcionário
            </button>
        </div>
        <div id="lista-funcionarios">
            <div class="vazio">Carregando funcionários...</div>
        </div>
    </div>
  </main>
</div>

<!-- MODAL DE FUNCIONÁRIO -->
<div id="modal-funcionario" class="modal-overlay">
  <div class="modal-conteudo">
    <div class="modal-header">
      <h3 id="titulo-modal-func">Novo Funcionário</h3>
      <button class="fechar-modal" onclick="fecharModalFuncionario()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="form-manual">
      <div class="input-group">
        <input type="hidden" id="func-id">
        <input type="text" id="func-login" placeholder="Login (ex: joao123)" required>
        <input type="text" id="func-senha" placeholder="Senha" required>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-admin btn-admin-primario btn-enviar-manual" onclick="salvarFuncionario()">
        <i class="fa-solid fa-floppy-disk"></i> Salvar
      </button>
    </div>
  </div>
</div>

<!-- MODAL DE PERFIL DO ADMIN -->
<div id="modal-perfil" class="modal-overlay">
  <div class="modal-conteudo">
    <div class="modal-header">
      <h3>Meu Perfil</h3>
      <button class="fechar-modal" onclick="fecharModalPerfil()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="form-manual">
      <div class="input-group">
        <input type="hidden" id="perfil-id">
        <input type="text" id="perfil-login" placeholder="Seu Login" required>
        <input type="text" id="perfil-senha" placeholder="Sua Senha" required>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-admin btn-admin-primario btn-enviar-manual" onclick="salvarPerfil()">
        <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../script/impressora.js"></script>
<script src="../script/admin-dashboard.js"></script>
</body>
</html>
