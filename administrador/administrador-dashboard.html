<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Na Brasas</title>
<link rel="stylesheet" href="../estilos/style.css">
<link rel="stylesheet" href="../estilos/styleadmin.css">

<!-- FontAwesome para os ícones de paginação, lixeira, etc -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Carrega o Google Charts -->
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div id="view-dash" class="ativo">
  <header>
    <div>
      <h1>Painel Admin</h1>
      <div class="user-info" id="user-info">Carregando...</div>
    </div>
    <div class="botoes">
        <!-- Botão Bluetooth -->
        <button class="btn-admin tooltip" id="btn-conectar">
            <span id="txt-bt">🔌 Conectar Bluetooth</span>
            <span class="tooltip-content" id="tip-bt">Conectar via Bluetooth (Celular)</span>
        </button>
        <!-- Botão USB -->
        <button class="btn-admin tooltip" id="btn-conectar-usb">
            <span id="txt-usb">🔗 Conectar USB</span>
            <span class="tooltip-content" id="tip-usb">
                Conectar via Cabo USB (PC)<br>
                Use o app <a href="https://zadig.akeo.ie" target="_blank">Zadig</a> no Windows.
            </span>
        </button>
        <!-- Botão Sair -->
        <button class="btn-admin btn-admin-perigo" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="status-impressora" id="status-impressora">
    <span class="bolinha"></span>
    <span id="status-texto">Impressora desconectada</span>
  </div>

  <!-- NAVEGAÇÃO POR ABAS -->
  <div class="abas-container">
    <button class="aba-btn ativo" onclick="mudarAba('recentes')">Pedidos Recentes</button>
    <button class="aba-btn" onclick="mudarAba('historico')">Histórico de Impressões</button>
    <button class="aba-btn" onclick="mudarAba('graficos')">Gráficos de Vendas</button>
  </div>

  <main>
    <!-- ABA 1: RECENTES -->
    <div id="aba-recentes" class="conteudo-aba ativo">
      <h2>Pedidos na Fila</h2>
      <div id="lista-pedidos">
        <div class="vazio">Nenhum pedido ainda. Aguardando...</div>
      </div>
      <div id="paginacao-recentes" class="paginacao-container"></div>
    </div>

    <!-- ABA 2: HISTÓRICO -->
    <div id="aba-historico" class="conteudo-aba">
      <h2>Pedidos Arquivados / Impressos</h2>
      <div id="lista-historico">
        <div class="vazio">Carregando histórico...</div>
      </div>
      <div id="paginacao-historico" class="paginacao-container"></div>
    </div>

    <!-- ABA 3: GRÁFICOS -->
    <div id="aba-graficos" class="conteudo-aba">
      <h2>Análise de Vendas</h2>
      <div class="grafico-container">
        <div id="piechart" style="width: 100%; height: 400px;"></div>
      </div>
      <div class="grafico-container" style="margin-top: 30px;">
        <div id="linechart" style="width: 100%; height: 400px;"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Carrega a lógica da impressora primeiro -->
<script src="../script/impressora.js"></script>
<!-- Depois carrega a lógica do painel -->
<script src="../script/admin-dashboard.js"></script>
</body>
</html>
