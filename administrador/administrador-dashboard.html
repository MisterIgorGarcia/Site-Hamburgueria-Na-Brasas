<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Na Brasas</title>
<link rel="stylesheet" href="../estilos/style.css">
<link rel="stylesheet" href="../estilos/styleadmin.css">
</head>
<body>

<div id="view-dash" class="ativo">
  <header>
    <div>
      <h1>Painel Admin</h1>
      <div class="user-info" id="user-info">Carregando...</div>
    </div>
    <div class="botoes">
      <button class="btn-admin" id="btn-conectar">🔌 Conectar Impressora</button>
      <button class="btn-admin btn-admin-perigo" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="status-impressora" id="status-impressora">
    <span class="bolinha"></span>
    <span id="status-texto">Impressora desconectada</span>
  </div>

  <main>
    <h2>Pedidos recentes (Admin)</h2>
    <div id="lista-pedidos">
      <div class="vazio">Nenhum pedido ainda...</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../script/admin-dashboard.js"></script>
</body>
</html>
