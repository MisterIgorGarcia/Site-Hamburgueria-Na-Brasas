<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Na Brasas</title>
    
    <!-- Carrega os estilos -->
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="../estilos/styleadmin.css">
    <!-- FontAwesome para o ícone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--cor-primaria);
            margin: 0;
        }
        
        #view-login {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Estilo do botão voltar copiando o botão original */
        .btn-voltar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--cor-secundaria);
            color: var(--cor-primaria);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            margin-top: 12px; /* Espaço entre o Entrar e o Voltar */
            transition: background 0.2s;
            cursor: pointer;
        }
        
        /* Efeito hover idêntico ao do botão de entrar */
        .btn-voltar:hover {
            background: #ffe066;
        }
    </style>
</head>
<body>

<div id="view-login">
  <div class="login-box">
    <h1>Painel — Na Brasas</h1>
    <p>Acesso restrito</p>
    
    <form id="form-login">
      <label>Login</label>
      <input type="text" id="inp-login" required autocomplete="username">
      <label>Senha</label>
      <input type="password" id="inp-senha" required autocomplete="current-password">
      
      <button type="submit" id="btn-entrar">Entrar</button>
      <div class="erro" id="login-erro"></div>
    </form>

    <!-- Botão Voltar com o mesmo estilo do Entrar -->
    <a href="../index.html" class="btn-voltar">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
    </a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../script/login.js"></script>
</body>
</html>
