<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Na Brasas</title>
    
    <!-- Carrega os estilos -->
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="../estilos/styleadmin.css">
    <!-- FontAwesome para o ícone de voltar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Estilo extra para forçar a centralização e o botão de voltar -->
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--cor-primaria);
            margin: 0;
        }
        
        #view-login {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Novo estilo do botão voltar (embaixo do Entrar) */
        .btn-voltar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
            width: 100%;
        }
        
        .btn-voltar:hover {
            color: var(--cor-secundaria);
        }
    </style>
</head>
<body>

<div id="view-login">
  <div class="login-box">
    <h1>Painel — Na Brasas</h1>
    <p>Acesso restrito</p>
    
    <form id="form-login">
      <label>Login</label>
      <input type="text" id="inp-login" required autocomplete="username">
      <label>Senha</label>
      <input type="password" id="inp-senha" required autocomplete="current-password">
      
      <button type="submit" id="btn-entrar">Entrar</button>
      <div class="erro" id="login-erro"></div>
    </form>

    <!-- Botão de Voltar agora fica aqui dentro da caixa -->
    <a href="../index.html" class="btn-voltar">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
    </a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../script/login.js"></script>
</body>
</html>
